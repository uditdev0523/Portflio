<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <radialGradient id="fundusBg" cx="45%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#2D1111" />
      <stop offset="55%" stop-color="#190707" />
      <stop offset="85%" stop-color="#0E0F14" />
      <stop offset="100%" stop-color="#090A0B" />
    </radialGradient>
    <radialGradient id="gradCamHeat" cx="42%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#FFB300" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#02D2E3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#02D2E3" stop-opacity="0.0" />
    </radialGradient>
    <pattern id="diagGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 30 M 0 0 L 30 30" fill="none" stroke="#02D2E3" stroke-width="0.4" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="#0E0F14" />
  <rect width="1200" height="750" fill="url(#diagGrid)" />

  <!-- Retinal Fundus Scan Area (Left/Center) -->
  <g transform="translate(100, 75)">
    <!-- Main Eye Globe Silhouette -->
    <circle cx="300" cy="300" r="280" fill="url(#fundusBg)" stroke="#02D2E3" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="300" cy="300" r="290" fill="none" stroke="#DFE5E9" stroke-width="0.7" stroke-opacity="0.2" stroke-dasharray="6 6" />

    <!-- Retinal Blood Vessels (Synthesized branching tree) -->
    <g stroke="#801C1C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 230 300 Q 200 240 160 170 Q 120 130 90 90" stroke-width="3.5" />
      <path d="M 230 300 Q 260 210 280 140 Q 310 100 360 70" stroke-width="3" />
      <path d="M 230 300 Q 200 360 170 430 Q 130 480 90 510" stroke-width="3.2" />
      <path d="M 230 300 Q 270 380 320 440 Q 380 490 440 510" stroke-width="2.8" />
      <!-- Smaller capillaries -->
      <path d="M 160 170 Q 190 140 220 110" stroke-width="1.5" stroke="#9E2B2B"/>
      <path d="M 280 140 Q 340 160 400 150" stroke-width="1.5" stroke="#9E2B2B"/>
      <path d="M 170 430 Q 210 450 250 490" stroke-width="1.5" stroke="#9E2B2B"/>
      <path d="M 320 440 Q 350 400 410 390" stroke-width="1.5" stroke="#9E2B2B"/>
    </g>

    <!-- Optic Disc -->
    <circle cx="230" cy="300" r="34" fill="#FFC799" fill-opacity="0.6" stroke="#FFE2B8" stroke-width="1" />
    <circle cx="230" cy="300" r="18" fill="#FFF5EB" fill-opacity="0.8" />

    <!-- Grad-CAM Saliency Heatmap Overlay -->
    <circle cx="280" cy="270" r="180" fill="url(#gradCamHeat)" style="mix-blend-mode: screen;" />

    <!-- Detected Lesion Bounding Boxes & Microaneurysms -->
    <g stroke="#02D2E3" stroke-width="1.5" fill="none">
      <rect x="290" y="220" width="65" height="50" rx="2" stroke="#FF2A55" stroke-dasharray="3 3"/>
      <text x="290" y="214" font-family="'Space Grotesk', monospace" font-size="9" fill="#FF2A55" font-weight="700">HEM_01 // 97.4%</text>

      <rect x="360" y="290" width="80" height="60" rx="2" stroke="#FFB300" />
      <text x="360" y="284" font-family="'Space Grotesk', monospace" font-size="9" fill="#FFB300" font-weight="700">EXUD_04 // 92.8%</text>

      <rect x="210" y="380" width="55" height="45" rx="2" stroke="#02D2E3" />
      <text x="210" y="374" font-family="'Space Grotesk', monospace" font-size="9" fill="#02D2E3" font-weight="700">MA_02 // 89.1%</text>
    </g>

    <!-- Crosshair Target reticle -->
    <circle cx="300" cy="300" r="70" stroke="#02D2E3" stroke-width="1" stroke-dasharray="4 6" fill="none" opacity="0.6"/>
    <line x1="300" y1="210" x2="300" y2="390" stroke="#02D2E3" stroke-width="0.75" opacity="0.4"/>
    <line x1="210" y1="300" x2="390" y2="300" stroke="#02D2E3" stroke-width="0.75" opacity="0.4"/>
  </g>

  <!-- Right Side: AI Telemetry & Explainability Diagnostics HUD -->
  <g transform="translate(740, 75)">
    <!-- Card Container -->
    <rect width="400" height="600" fill="#141720" stroke="#02D2E3" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- Header -->
    <rect width="400" height="42" fill="#1B1D24" />
    <path d="M 0 0 L 10 0 L 0 10 Z" fill="#02D2E3" />
    <text x="18" y="26" font-family="'Space Grotesk', monospace" font-size="11" fill="#02D2E3" font-weight="600" letter-spacing="2">NETRASETU // INFERENCE ENGINE</text>
    <circle cx="375" cy="21" r="5" fill="#02D2E3" />

    <!-- Diagnostic Classification -->
    <g transform="translate(24, 65)">
      <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="10" fill="#B6C1C8" letter-spacing="1.5">DR SEVERITY GRADING</text>
      <text x="0" y="28" font-family="'Oswald', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF">MODERATE NPDR</text>
      <text x="260" y="26" font-family="'Oswald', sans-serif" font-size="24" font-weight="700" fill="#02D2E3">STAGE 2</text>
      
      <!-- Progress Bar -->
      <rect x="0" y="42" width="352" height="6" fill="#1B1D24" rx="2" />
      <rect x="0" y="42" width="248" height="6" fill="#02D2E3" rx="2" />
      <text x="0" y="64" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">CONFIDENCE SCORE: 94.6% // ENTROPY: 0.124</text>
    </g>

    <!-- Grad-CAM Neural Layer Activation Bar Graph -->
    <g transform="translate(24, 165)">
      <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="10" fill="#B6C1C8" letter-spacing="1.5">GRAD-CAM LAYER SALIENCY</text>

      <g transform="translate(0, 18)" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">
        <text x="0" y="10">Conv5_Block3_Out</text>
        <rect x="130" y="2" width="180" height="10" fill="#1B1D24" />
        <rect x="130" y="2" width="162" height="10" fill="#02D2E3" />
        <text x="320" y="10" fill="#02D2E3">0.90</text>

        <text x="0" y="32">Conv4_Block2_Out</text>
        <rect x="130" y="24" width="180" height="10" fill="#1B1D24" />
        <rect x="130" y="24" width="134" height="10" fill="#02D2E3" opacity="0.8"/>
        <text x="320" y="32" fill="#02D2E3">0.74</text>

        <text x="0" y="54">Conv3_Block1_Out</text>
        <rect x="130" y="46" width="180" height="10" fill="#1B1D24" />
        <rect x="130" y="46" width="88" height="10" fill="#02D2E3" opacity="0.6"/>
        <text x="320" y="54" fill="#02D2E3">0.49</text>
      </g>
    </g>

    <!-- Referral & Clinical Decision Flag -->
    <g transform="translate(24, 280)">
      <rect width="352" height="60" fill="#1B1D24" stroke="#FFB300" stroke-width="1" />
      <circle cx="24" cy="30" r="10" fill="#FFB300" fill-opacity="0.2" stroke="#FFB300" stroke-width="1.5"/>
      <text x="24" y="34" font-family="'Space Grotesk', monospace" font-size="12" font-weight="700" fill="#FFB300" text-anchor="middle">!</text>
      <text x="46" y="25" font-family="'Space Grotesk', monospace" font-size="10" font-weight="700" fill="#FFFFFF">CLINICAL TRIAGE FLAG: REFERRAL REQUIRED</text>
      <text x="46" y="42" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">Ophthalmologist follow-up suggested within 60 days</text>
    </g>

    <!-- Model & Architecture Pipeline -->
    <g transform="translate(24, 370)">
      <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="10" fill="#B6C1C8" letter-spacing="1.5">PIPELINE ARCHITECTURE</text>
      
      <g transform="translate(0, 16)">
        <rect x="0" y="0" width="105" height="40" fill="#1B1D24" stroke="#DFE5E9" stroke-opacity="0.2"/>
        <text x="52" y="18" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#02D2E3">PREPROCESS</text>
        <text x="52" y="30" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="7" fill="#B6C1C8">CLAHE / OpenCV</text>

        <line x1="105" y1="20" x2="123" y2="20" stroke="#02D2E3" stroke-width="1.5"/>

        <rect x="123" y="0" width="105" height="40" fill="#1B1D24" stroke="#02D2E3" stroke-width="1"/>
        <text x="175" y="18" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#FFFFFF">CNN BACKBONE</text>
        <text x="175" y="30" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="7" fill="#02D2E3">PyTorch Custom</text>

        <line x1="228" y1="20" x2="246" y2="20" stroke="#02D2E3" stroke-width="1.5"/>

        <rect x="246" y="0" width="105" height="40" fill="#1B1D24" stroke="#DFE5E9" stroke-opacity="0.2"/>
        <text x="298" y="18" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#02D2E3">GRAD-CAM</text>
        <text x="298" y="30" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="7" fill="#B6C1C8">Heatmap Saliency</text>
      </g>
    </g>

    <!-- Footer Specs -->
    <g transform="translate(24, 530)">
      <line x1="0" y1="0" x2="352" y2="0" stroke="#DFE5E9" stroke-opacity="0.1" />
      <text x="0" y="24" font-family="'Space Grotesk', monospace" font-size="9" fill="#02D2E3">LATENCY: 142ms // TENSORFLOW-LITE READY</text>
      <text x="0" y="40" font-family="'Space Grotesk', monospace" font-size="8" fill="#B6C1C8">DEPLOYED TARGET: RURAL TELE-HEALTH KIOSK</text>
    </g>
  </g>

  <!-- Frame Outer Border Brackets -->
  <g stroke="#02D2E3" stroke-width="2" fill="none">
    <path d="M 20 50 L 20 20 L 50 20" />
    <path d="M 1180 50 L 1180 20 L 1150 20" />
    <path d="M 20 700 L 20 730 L 50 730" />
    <path d="M 1180 700 L 1180 730 L 1150 730" />
  </g>
  <text x="20" y="14" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8" letter-spacing="2">PROJECT_01 // AI_HEALTHCARE_TELEMETRY</text>
</svg>