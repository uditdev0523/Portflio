<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#02D2E3" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="#0E0F14" />
  <rect width="1200" height="750" fill="url(#matrixGrid)" />

  <!-- Top System Telemetry Bar -->
  <g transform="translate(40, 30)">
    <rect width="1120" height="45" fill="#141720" stroke="#02D2E3" stroke-width="1" stroke-opacity="0.4"/>
    <text x="20" y="28" font-family="'Space Grotesk', monospace" font-size="12" fill="#02D2E3" font-weight="700" letter-spacing="2">STUDENT RESULT MANAGEMENT SYSTEM // DATA ENGINE</text>
    <text x="750" y="28" font-family="'Space Grotesk', monospace" font-size="11" fill="#B6C1C8">PERSISTENCE: SQLITE // QUERY LATENCY: 2.1ms</text>
    <circle cx="1080" cy="23" r="5" fill="#02D2E3" />
    <text x="1050" y="27" font-family="'Space Grotesk', monospace" font-size="10" fill="#02D2E3" text-anchor="end">DATABASE ONLINE</text>
  </g>

  <!-- Left Side: Relational Schema & GPA Compute Architecture -->
  <g transform="translate(40, 100)">
    <rect width="680" height="580" fill="#141720" stroke="#DFE5E9" stroke-opacity="0.15" stroke-width="1" />
    <rect width="680" height="34" fill="#1B1D24" />
    <text x="18" y="22" font-family="'Space Grotesk', monospace" font-size="11" fill="#02D2E3" font-weight="700">RELATIONAL SCHEMA &amp; COMPUTATION PIPELINE</text>

    <!-- Entity Tables -->
    <!-- Table 1: STUDENTS -->
    <g transform="translate(40, 60)">
      <rect width="180" height="150" fill="#0E0F14" stroke="#02D2E3" stroke-width="1"/>
      <rect width="180" height="26" fill="#1B1D24"/>
      <text x="10" y="18" font-family="'Space Grotesk', monospace" font-size="10" fill="#02D2E3" font-weight="700">TABLE: students</text>
      <g transform="translate(10, 42)" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">
        <text x="0" y="0" fill="#02D2E3">PK id: INTEGER</text>
        <text x="0" y="20">roll_no: VARCHAR(20)</text>
        <text x="0" y="40">name: VARCHAR(100)</text>
        <text x="0" y="60">semester: INT</text>
        <text x="0" y="80">cgpa: DECIMAL(4,2)</text>
      </g>
    </g>

    <!-- Table 2: COURSES -->
    <g transform="translate(460, 60)">
      <rect width="180" height="150" fill="#0E0F14" stroke="#02D2E3" stroke-width="1"/>
      <rect width="180" height="26" fill="#1B1D24"/>
      <text x="10" y="18" font-family="'Space Grotesk', monospace" font-size="10" fill="#02D2E3" font-weight="700">TABLE: courses</text>
      <g transform="translate(10, 42)" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">
        <text x="0" y="0" fill="#02D2E3">PK course_id: VARCHAR</text>
        <text x="0" y="20">title: VARCHAR(100)</text>
        <text x="0" y="40">credits: INT</text>
        <text x="0" y="60">department: VARCHAR</text>
        <text x="0" y="80">max_marks: INT</text>
      </g>
    </g>

    <!-- Table 3: RESULTS / GRADES -->
    <g transform="translate(250, 240)">
      <rect width="180" height="150" fill="#0E0F14" stroke="#02D2E3" stroke-width="1.5"/>
      <rect width="180" height="26" fill="#1B1D24"/>
      <text x="10" y="18" font-family="'Space Grotesk', monospace" font-size="10" fill="#02D2E3" font-weight="700">TABLE: results</text>
      <g transform="translate(10, 42)" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">
        <text x="0" y="0" fill="#02D2E3">PK result_id: INT</text>
        <text x="0" y="20">FK student_id: INT</text>
        <text x="0" y="40">FK course_id: VARCHAR</text>
        <text x="0" y="60">marks_obtained: INT</text>
        <text x="0" y="80" fill="#02D2E3">grade_point: DECIMAL</text>
      </g>
    </g>

    <!-- Relational connectors -->
    <path d="M 220 135 L 290 135 L 290 240" stroke="#02D2E3" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <circle cx="290" cy="240" r="3" fill="#02D2E3"/>

    <path d="M 460 135 L 390 135 L 390 240" stroke="#02D2E3" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
    <circle cx="390" cy="240" r="3" fill="#02D2E3"/>

    <!-- Batch Analytics & GPA Distribution Matrix -->
    <g transform="translate(40, 430)">
      <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="10" fill="#B6C1C8" letter-spacing="1">BATCH GPA DISTRIBUTION // TELEMETRY</text>
      <rect x="0" y="10" width="600" height="100" fill="#0E0F14" stroke="#DFE5E9" stroke-opacity="0.1" />

      <!-- Bar Graph -->
      <g transform="translate(40, 90)">
        <rect x="0" y="-20" width="40" height="20" fill="#1B1D24" stroke="#02D2E3"/>
        <text x="20" y="14" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#B6C1C8">&lt;6.0</text>

        <rect x="70" y="-40" width="40" height="40" fill="#1B1D24" stroke="#02D2E3"/>
        <text x="90" y="14" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#B6C1C8">6.0-7.0</text>

        <rect x="140" y="-70" width="40" height="70" fill="#02D2E3" fill-opacity="0.7"/>
        <text x="160" y="14" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#FFFFFF">7.0-8.0</text>

        <rect x="210" y="-85" width="40" height="85" fill="#02D2E3"/>
        <text x="230" y="14" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#02D2E3">8.0-9.0</text>

        <rect x="280" y="-30" width="40" height="30" fill="#1B1D24" stroke="#02D2E3"/>
        <text x="300" y="14" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="8" fill="#B6C1C8">&gt;9.0</text>

        <!-- Stat annotation -->
        <text x="400" y="-50" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">MEDIAN GPA: <tspan fill="#02D2E3">8.14</tspan></text>
        <text x="400" y="-30" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">TOTAL RECORDS: <tspan fill="#FFFFFF">1,240</tspan></text>
      </g>
    </g>
  </g>

  <!-- Right Side: Terminal Execution & Report Generator Output -->
  <g transform="translate(745, 100)">
    <rect width="415" height="580" fill="#141720" stroke="#DFE5E9" stroke-opacity="0.15" stroke-width="1" />
    <rect width="415" height="34" fill="#1B1D24" />
    <text x="18" y="22" font-family="'Space Grotesk', monospace" font-size="11" fill="#02D2E3" font-weight="700">TERMINAL OUTPUT // REPORT EXECUTION</text>

    <!-- Terminal Code Box -->
    <g transform="translate(20, 55)">
      <rect width="375" height="380" fill="#090A0B" stroke="#02D2E3" stroke-width="1" rx="2"/>
      <g transform="translate(15, 25)" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8">
        <text x="0" y="0" fill="#02D2E3">$ python result_engine.py --eval-batch=2025_CSE</text>
        <text x="0" y="25" fill="#FFFFFF">[INFO] Connected to sqlite3://student_records.db</text>
        <text x="0" y="50" fill="#FFFFFF">[OK] Loaded 6 Core Modules for AKTU Semester 1</text>
        <text x="0" y="75" fill="#FFFFFF">[CALC] Computing SGPA/CGPA with Weighted Credits...</text>
        <text x="0" y="105" fill="#02D2E3">==============================================</text>
        <text x="0" y="125" fill="#FFFFFF">STUDENT: UDIT PRATAP SINGH (NIET_CSE_25)</text>
        <text x="0" y="145" fill="#FFFFFF">COURSE CS101: 91/100 (GRADE: A+ | CREDITS: 4)</text>
        <text x="0" y="165" fill="#FFFFFF">COURSE CS102: 86/100 (GRADE: A  | CREDITS: 4)</text>
        <text x="0" y="185" fill="#FFFFFF">COURSE MA101: 82/100 (GRADE: A  | CREDITS: 4)</text>
        <text x="0" y="205" fill="#FFFFFF">COURSE EE101: 79/100 (GRADE: B+ | CREDITS: 3)</text>
        <text x="0" y="225" fill="#02D2E3">==============================================</text>
        <text x="0" y="250" fill="#02D2E3" font-weight="700">CUMULATIVE CGPA: 8.20 / 10.00 [VERIFIED]</text>
        <text x="0" y="275" fill="#FFFFFF">[EXPORT] PDF Transcript generated: ./transcripts/</text>
        <text x="0" y="300" fill="#B6C1C8">[STATUS] Execution finished in 18ms</text>
        <text x="0" y="325" fill="#02D2E3">$ _</text>
      </g>
    </g>

    <!-- Tech Stack -->
    <g transform="translate(20, 470)">
      <text x="0" y="0" font-family="'Space Grotesk', monospace" font-size="10" fill="#B6C1C8" letter-spacing="1">CORE ARCHITECTURE</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="70" height="24" fill="#1B1D24" stroke="#02D2E3" stroke-width="1"/>
        <text x="35" y="16" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="9" fill="#02D2E3">C</text>

        <rect x="80" y="0" width="80" height="24" fill="#1B1D24" stroke="#02D2E3" stroke-width="1"/>
        <text x="120" y="16" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="9" fill="#02D2E3">PYTHON</text>

        <rect x="170" y="0" width="80" height="24" fill="#1B1D24" stroke="#02D2E3" stroke-width="1"/>
        <text x="210" y="16" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="9" fill="#02D2E3">SQLITE</text>

        <rect x="260" y="0" width="115" height="24" fill="#1B1D24" stroke="#02D2E3" stroke-width="1"/>
        <text x="317" y="16" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="9" fill="#02D2E3">DATA STRUCTURES</text>
      </g>
    </g>
  </g>

  <!-- Outer Brackets -->
  <g stroke="#02D2E3" stroke-width="2" fill="none">
    <path d="M 20 50 L 20 20 L 50 20" />
    <path d="M 1180 50 L 1180 20 L 1150 20" />
    <path d="M 20 700 L 20 730 L 50 730" />
    <path d="M 1180 700 L 1180 730 L 1150 730" />
  </g>
  <text x="20" y="14" font-family="'Space Grotesk', monospace" font-size="9" fill="#B6C1C8" letter-spacing="2">PROJECT_05 // STUDENT_RESULT_MANAGEMENT_SYSTEM</text>
</svg>
